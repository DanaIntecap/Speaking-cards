<script>

let allQuestions = [];
let availableQuestions = [];
let remainingQuestions = [];
let currentCard = null;

fetch("questions.json")
.then(response => response.json())
.then(data => {

    allQuestions = [...data];

    populateFilters();

    applyFilters();

})
.catch(error => {

    document.getElementById("question").innerHTML =
    "Error loading questions.json";

    console.error(error);

});

function populateFilters(){

    updateFilterOptions();

    document.getElementById("levelFilter")
    .addEventListener("change", applyFilters);

    document.getElementById("unitFilter")
    .addEventListener("change", applyFilters);

    document.getElementById("topicFilter")
    .addEventListener("change", applyFilters);

}

function updateFilterOptions(){

    const selectedLevel =
    document.getElementById("levelFilter")?.value || "";

    const selectedUnit =
    document.getElementById("unitFilter")?.value || "";

    const levelSelect =
    document.getElementById("levelFilter");

    const unitSelect =
    document.getElementById("unitFilter");

    const topicSelect =
    document.getElementById("topicFilter");

    const levels =
    [...new Set(allQuestions.map(q => q.Level))]
    .sort();

    let unitsData = allQuestions;

    if(selectedLevel){

        unitsData =
        unitsData.filter(
            q => q.Level === selectedLevel
        );

    }

    const units =
    [...new Set(unitsData.map(q => q.Unit))]
    .sort((a,b)=>a-b);

    let topicsData = unitsData;

    if(selectedUnit){

        topicsData =
        topicsData.filter(
            q => String(q.Unit) === selectedUnit
        );

    }

    const topics =
    [...new Set(topicsData.map(q => q.Topic))]
    .sort();

    levelSelect.innerHTML =
    '<option value="">All Levels</option>';

    unitSelect.innerHTML =
    '<option value="">All Units</option>';

    topicSelect.innerHTML =
    '<option value="">All Topics</option>';

    levels.forEach(level=>{

        levelSelect.innerHTML +=
        `<option value="${level}">
            ${level}
        </option>`;

    });

    units.forEach(unit=>{

        unitSelect.innerHTML +=
        `<option value="${unit}">
            Unit ${unit}
        </option>`;

    });

    topics.forEach(topic=>{

        topicSelect.innerHTML +=
        `<option value="${topic}">
            ${topic}
        </option>`;

    });

}

function applyFilters(){

    updateFilterOptions();

    const level =
    document.getElementById("levelFilter").value;

    const unit =
    document.getElementById("unitFilter").value;

    const topic =
    document.getElementById("topicFilter").value;

    availableQuestions =
    allQuestions.filter(q => {

        const levelMatch =
        !level ||
        q.Level === level;

        const unitMatch =
        !unit ||
        String(q.Unit) === unit;

        const topicMatch =
        !topic ||
        q.Topic === topic;

        return (
            levelMatch &&
            unitMatch &&
            topicMatch
        );

    });

    remainingQuestions =
    [...availableQuestions];

    updateCounter();

}

function nextCard(){

    if(remainingQuestions.length === 0){

        remainingQuestions =
        [...availableQuestions];

    }

    if(remainingQuestions.length === 0){

        document.getElementById("question")
        .innerHTML =
        "No questions match the selected filters.";

        return;

    }

    const randomIndex =
    Math.floor(
        Math.random() *
        remainingQuestions.length
    );

    currentCard =
    remainingQuestions[randomIndex];

    remainingQuestions.splice(
        randomIndex,
        1
    );

    document.getElementById("question")
    .innerHTML =
    currentCard.Question;

    document.getElementById("levelTag")
    .innerHTML =
    currentCard.Level;

    document.getElementById("unitTag")
    .innerHTML =
    "Unit " + currentCard.Unit;

    document.getElementById("topicTag")
    .innerHTML =
    currentCard.Topic;

    document.getElementById("hintBox")
    .classList.add("hidden");

    document.getElementById("answerBox")
    .classList.add("hidden");

    updateCounter();

}

function toggleHint(){

    if(!currentCard) return;

    const box =
    document.getElementById("hintBox");

    box.innerHTML =
    currentCard.Hint
    ? "<strong>Hint:</strong><br><br>" +
      currentCard.Hint
    : "<strong>No hint available.</strong>";

    box.classList.toggle("hidden");

}

function toggleAnswer(){

    if(!currentCard) return;

    const box =
    document.getElementById("answerBox");

    box.innerHTML =
    currentCard.Answer
    ? "<strong>Sample Answer:</strong><br><br>" +
      currentCard.Answer
    : "<strong>No sample answer available.</strong>";

    box.classList.toggle("hidden");

}

function playQuestion(){

    if(!currentCard) return;

    speechSynthesis.cancel();

    const msg =
    new SpeechSynthesisUtterance(
        currentCard.Question
    );

    msg.lang = "en-US";

    msg.rate =
    Number(
        document.getElementById("speechRate").value
    );

    speechSynthesis.speak(msg);

}

function resetFilters(){

    document.getElementById("levelFilter").value = "";
    document.getElementById("unitFilter").value = "";
    document.getElementById("topicFilter").value = "";

    applyFilters();

}

function updateCounter(){

    document.getElementById("counter")
    .innerHTML =

    "Filtered Questions: "
    + availableQuestions.length +

    "<br>Cards Remaining: "
    + remainingQuestions.length;

}

</script>
