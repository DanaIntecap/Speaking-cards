<style>

body{
    font-family:'Montserrat',sans-serif;
    background:#0060AA;
    margin:0;
    padding:20px;
    line-height:1.6;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
}

.banner{
    background:#0060AA;
    color:white;
    text-align:center;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
}

.banner h1{
    font-family:'Antonio',sans-serif;
    font-size:48px;
    margin:5px 0;
}

.banner h2{
    font-family:'Poppins',sans-serif;
    font-size:22px;
    font-weight:500;
    margin:0;
}

.logo-left{
    text-align:left;
}

.logo-left img{
    max-height:40px;
}

.logo-center img{
    max-height:140px;
}

.info-box{
    background:#f8f9fa;
    border-left:8px solid #0060AA;
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
}

.info-box h2{
    color:#0060AA;
    font-family:'Poppins',sans-serif;
}

.card{
    background:#f5f7fa;
    border-radius:18px;
    padding:30px;
    text-align:center;
    margin-top:20px;
    border:3px solid #dfe6ee;
}

.topic{
    display:inline-block;
    background:#0060AA;
    color:white;
    padding:8px 15px;
    border-radius:30px;
    font-size:14px;
    margin-bottom:20px;
}

.question{
    font-size:34px;
    font-weight:700;
    color:#00205b;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hidden{
    display:none;
}

.hint-box{
    margin-top:20px;
    background:#fff8d6;
    border-left:6px solid #ffed00;
    padding:15px;
    border-radius:10px;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
}

.btn-primary{
    background:#00205b;
    color:white;
}

.btn-listen{
    background:#ffed00;
    color:#00205b;
}

.counter{
    text-align:center;
    margin-top:15px;
    color:#555;
}

.challenge-box{
    background:#eaffea;
    border-left:6px solid #008D36;
    padding:18px;
    border-radius:10px;
    margin-top:20px;
}

footer{
    margin-top:30px;
    text-align:center;
    color:#666;
    font-size:12px;
}

@media(max-width:768px){

.question{
    font-size:24px;
}

.banner h1{
    font-size:34px;
}

}

</style>
